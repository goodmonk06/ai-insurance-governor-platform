version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance-platform-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: insurance_platform
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-network

  redis:
    image: redis:7-alpine
    container_name: insurance-platform-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - insurance-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: insurance-platform-api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/insurance_platform?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      RISK_SIMULATOR_URL: ${RISK_SIMULATOR_URL:-http://localhost:3001/api}
      RISK_SIMULATOR_USE_MOCK: ${RISK_SIMULATOR_USE_MOCK:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3001}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - insurance-network
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: insurance-platform-web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - '3001:3001'
    depends_on:
      - api
    networks:
      - insurance-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  insurance-network:
    driver: bridge
